<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home Automation Technology</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        /* CSS ESCURO PROFISSIONAL */
        body { background-color: #121212 !important; }
        .navbar { background-color: #1e1e1e !important; border-bottom: 1px solid #333; }
        .navbar-brand { color: #0d6efd !important; }
        .card { background-color: #1e1e1e; border: 1px solid #333; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card-header, .card-footer { background-color: #252525 !important; border-bottom: 1px solid #333; }
        .table { --bs-table-bg: #1e1e1e; --bs-table-border-color: #333; color: #e0e0e0; }
        .table-light th { background-color: #2d2d2d !important; color: #fff; border-color: #333; }
        .table-hover tbody tr:hover { background-color: #2a2a2a !important; }
        .form-control, .form-select { background-color: #2d2d2d; border-color: #444; color: #e0e0e0; }
        .form-control:focus, .form-select:focus { background-color: #333; border-color: #0d6efd; color: #fff; }
        ::placeholder { color: #888 !important; }
        .nav-tabs .nav-link.active { background-color: #1e1e1e; border-color: #333; border-bottom-color: transparent; color: #0d6efd; }
        .nav-tabs { border-bottom: 1px solid #333; }
        .dropdown-menu { background-color: #2d2d2d; border: 1px solid #444; }
        .dropdown-item { color: #e0e0e0; }
        .dropdown-item:hover { background-color: #3d3d3d; color: #fff; }
        .text-muted { color: #999 !important; }
        h1, h2, h3, h4, h5, h6 { color: #f0f0f0; }
        
        /* Ajuste do Modal Escuro */
        .modal-content { background-color: #1e1e1e; border: 1px solid #444; color: #e0e0e0; }
        .modal-header { border-bottom: 1px solid #333; }
        .modal-footer { border-top: 1px solid #333; }
        .btn-close { filter: invert(1) grayscale(100%) brightness(200%); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
                <i class="bi bi-house-gear-fill"></i> Home Automation Technology
            </a>
        </div>
    </nav>

    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
